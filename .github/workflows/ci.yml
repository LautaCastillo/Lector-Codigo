name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate -w backend
        env:
          DATABASE_URL: postgresql://x:y@localhost:5432/z
      - run: npm run build
      - run: npm run lint
      - run: npm test
